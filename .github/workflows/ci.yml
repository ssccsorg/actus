name: Test actus

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        run: |
          docker buildx build --load \
            --cache-from type=gha,scope=shared-actus \
            --cache-to type=gha,mode=min,scope=shared-actus \
            -t actus:ci \
            -f Dockerfile .

      - name: Run tests
        run: docker run --rm \
          -e ZED_BIN=/bin/true \
          -e LLM_API_KEY=ci-skip \
          --entrypoint ./run.sh \
          actus:ci --test
