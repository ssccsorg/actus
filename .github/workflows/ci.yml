name: Test actus

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build and test
        run: |
          docker buildx build --load \
            --cache-from type=gha,scope=shared-actus \
            --cache-to type=gha,mode=min,scope=shared-actus \
            -f Dockerfile .
        shell: bash
