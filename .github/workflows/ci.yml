name: Test actus

on:
  push:
    branches: ["main"]
    # Documentation-only changes (markdown, docs tree) skip CI entirely.
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build the test image
        run: |
          docker buildx build --load \
            --target test \
            --cache-from type=gha,scope=shared-actus \
            --cache-to type=gha,mode=min,scope=shared-actus \
            -t actus:ci \
            -f Dockerfile .

      - name: Run tests
        run: |
          # Mock-only policy: the agent is a stub (/bin/true) and the chat
          # round trip is skipped (ci-skip key plus the LLM_CHAT gate), so
          # CI never spends LLM tokens. run.sh also refuses the live tiers
          # whenever CI=true unless ALLOW_LLM_IN_CI=1 is set; no workflow
          # sets it. The suite compiles and runs the Rust unit and
          # integration tests (tests/*.rs) and exercises the HTTP
          # endpoints; live runs require LLM_CHAT=1 and a real key locally.
          # Contract E2E against the stub backend runs in the telos CI
          # workflow.
          docker run --rm \
            -e CI \
            -e ACTUS_EXECUTOR_BIN=/bin/true \
            -e LLM_API_KEY=ci-skip \
            --entrypoint ./run.sh \
            actus:ci --test

      # The store's integrity, named rather than left to the suite above: it is the one
      # check that fails when a store a deployment can select stops being covered, or when a
      # window read starts costing the thread instead of the window.
      - name: The store's integrity, named
        run: |
          docker run --rm \
            -e CI \
            --entrypoint cargo \
            actus:ci test --test store_integrity_test

  # Agent-binary tier: the sessionful contract used to be exercised here, by running this
  # repository's suite against the telos binary from its public image. The settings file a
  # sessionful executor reads is the executor's own format, so this crate's binary cannot
  # start one at all: the writer that renders it belongs to a deployment. That tier moved
  # with the writer, to the deployment (`kletos`, whose checks drive a real telos directly),
  # where the format and its writer live.

