name: Test actus

on:
  push:
    branches: ["main"]
    # Documentation-only changes (markdown, docs tree) skip CI entirely.
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build the test image
        run: |
          docker buildx build --load \
            --target test \
            --cache-from type=gha,scope=shared-actus \
            --cache-to type=gha,mode=min,scope=shared-actus \
            -t actus:ci \
            -f Dockerfile .

      - name: Run tests
        run: |
          # Mock-only policy: the agent is a stub (/bin/true) and the chat
          # round trip is skipped (ci-skip key plus the LLM_CHAT gate), so
          # CI never spends LLM tokens. The suite compiles and runs the Rust
          # unit and integration tests (tests/*.rs) and exercises the HTTP
          # endpoints; live runs require LLM_CHAT=1 and a real key locally.
          # Contract E2E against the fake backend runs in the telos CI
          # workflow.
          docker run --rm \
            -e TELOS_BIN=/bin/true \
            -e LLM_API_KEY=ci-skip \
            --entrypoint ./run.sh \
            actus:ci --test

  # Real-agent tier: runs the suite against the actual headless agent
  # binary from the public prebuilt telos image (ghcr.io/ssccsorg/telos).
  # The image is never built here and is pulled anonymously; an optional
  # ACTUS_TELOS_PAT (read:packages) is only used as a fallback while the
  # package is still private.
  e2e-real-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Real-agent suite against the prebuilt telos image
        env:
          ACTUS_TELOS_PAT: ${{ secrets.ACTUS_TELOS_PAT }}
        run: |
          set -e
          image="ghcr.io/ssccsorg/telos:latest"
          if ! docker pull "$image"; then
            if [ -n "$ACTUS_TELOS_PAT" ]; then
              echo "$ACTUS_TELOS_PAT" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
              docker pull "$image" || { echo "::notice::e2e-real-agent skipped: prebuilt telos image not available."; exit 0; }
            else
              echo "::notice::e2e-real-agent skipped: prebuilt telos image not available."
              exit 0
            fi
          fi
          # Stub backend keeps the tier LLM-free while the real binary
          # connects, so health reflects telos_connected/agent_ready true
          # and the full endpoint suite runs against a real agent process.
          docker run --rm \
            -e TELOS_BIN=/workspace/target/telos-release/tel \
            -e LLM_API_KEY=ci-skip \
            -e TELOS_STUB_BACKEND=1 \
            -v "$GITHUB_WORKSPACE:/workspace/actus" \
            -w /workspace/actus \
            "$image" \
            bash run.sh --test

