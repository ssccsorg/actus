name: Publish actus Docker Image

# Publishing follows main: a consumer that wants the current server can name `latest`
# instead of resolving a digest by hand after every tag, which is what left one consumer's
# pin stale through the release that introduced `kind = "native"`. `latest` moving with main
# is the cost of that, and a consumer that needs a fixed build pins `:<tag>` or a digest.
#
#   main push:        ghcr.io/ssccsorg/actus:latest and :main
#   version tag:      ghcr.io/ssccsorg/actus:<tag> and :latest
#   manual dispatch:  ghcr.io/ssccsorg/actus:dev, which never touches latest
#
on:
  push:
    branches: ["main"]
    # Documentation-only changes do not rebuild or publish the image.
    paths-ignore: ["**/*.md", "**/*.qmd", "docs/**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: "actus-image"
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ssccsorg/actus

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive image tags
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            # Version tag (for example v0.1.1): the version, and latest.
            echo "tags=${IMAGE}:${{ github.ref_name }},${IMAGE}:latest" >>"$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # A main push is what a consumer tracking the sources wants.
            echo "tags=${IMAGE}:latest,${IMAGE}:main" >>"$GITHUB_OUTPUT"
          else
            # Manual dispatch: a dev snapshot that never touches latest.
            echo "tags=${IMAGE}:dev" >>"$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha,scope=shared-actus
          cache-to: type=gha,mode=min,scope=shared-actus
          provenance: false
          sbom: false

      - name: Prune old cache
        run: |
          gh extension install actions/gh-actions-cache 2>/dev/null || true
          gh actions-cache delete ${{ env.IMAGE_NAME }} --confirm 2>/dev/null || true
        continue-on-error: true
        shell: bash
