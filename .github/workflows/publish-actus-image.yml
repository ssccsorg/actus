name: Publish actus Docker Image

# Publishing is release-gated: actus is pre-1.0 and has shipped no release
# yet, so ordinary main commits push nothing. Pushing a `v*` tag cuts a
# versioned image (and refreshes `latest`); a manual dispatch publishes a
# `:dev` snapshot for preflight without touching `latest`.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: "actus-image"
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ssccsorg/actus

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive image tags
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Version tag (for example v0.1.0): tag the image with the
            # version and refresh latest.
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >>"$GITHUB_OUTPUT"
          else
            # Manual dispatch: a dev snapshot that never touches latest.
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev" >>"$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha,scope=shared-actus
          cache-to: type=gha,mode=min,scope=shared-actus
          provenance: false
          sbom: false

      - name: Prune old cache
        run: |
          gh extension install actions/gh-actions-cache 2>/dev/null || true
          gh actions-cache delete ${{ env.IMAGE_NAME }} --confirm 2>/dev/null || true
        continue-on-error: true
        shell: bash
